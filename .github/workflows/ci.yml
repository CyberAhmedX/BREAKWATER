name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-dist
          path: dist

  # Plays the built game in a real browser: one full run, every ending, and
  # each career track's own case.
  e2e:
    # Pinned: the Playwright version in package.json cannot install its browser
    # on Ubuntu 26.04, which ubuntu-latest now resolves to. Move this back to
    # ubuntu-latest when Playwright is upgraded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # Hosted runners have four cores and are several times slower than a
      # laptop, so the browser tests use all of them here.
      - name: Play the game
        run: npm run e2e -- --workers=4
      - name: Upload traces from failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
