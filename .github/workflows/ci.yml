name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-dist
          path: dist

  # Plays the built game in a real browser: one full run, every ending, and
  # each career track's own case.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # Hosted runners have four cores and are several times slower than a
      # laptop, so the browser tests use all of them here.
      - name: Play the game
        run: npm run e2e -- --workers=4
      - name: Upload traces from failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results

  # Builds the desktop app on Windows, so a change that breaks the installer
  # shows up here and not on release day. The installer is kept as an artifact
  # of the run, to try a build without tagging a release.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the Windows installer
        run: npm run desktop:build
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
