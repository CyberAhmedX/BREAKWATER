name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-dist
          path: dist

  # Plays the built game in a real browser: one full run, every ending, and
  # each career track's own case.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # Hosted runners have four cores and are several times slower than a
      # laptop, so the browser tests use all of them here.
      - name: Play the game
        run: npm run e2e -- --workers=4
      - name: Upload traces from failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results

  # Builds the desktop app for Windows, Linux and macOS, so a change that
  # breaks an installer shows up here and not on release day. The installers
  # are kept as artifacts of the run, to try a build without tagging a release.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: ubuntu-22.04
            name: linux
            args: ""
          # one app that runs on both Apple silicon and Intel Macs
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: Build the installers
        run: npm run desktop:build -- ${{ matrix.args }}
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/dmg/*.dmg
