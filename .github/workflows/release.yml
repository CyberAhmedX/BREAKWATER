name: Release

# Tag a version (for example: git tag v1.0.0 && git push origin v1.0.0) and this
# creates a GitHub Release and attaches the desktop app to it: the Windows
# installer, the Linux packages and the macOS disk image.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for a manual release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build release notes from CHANGELOG.md
        run: |
          ver="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${ver#v}"
          {
            echo "A cozy-to-dark cybersecurity career simulation."
            echo
            echo "Download the installer for your system below: **.exe** for Windows, **.dmg** for macOS, and **.deb**, **.rpm** or **.AppImage** for Linux. The game is free and runs offline."
            echo
            echo "The installers are not code signed. Windows asks before running one for the first time, and on macOS you right-click the app and choose Open."
            echo
            echo "Want to try it first? Play the demo in your browser: https://cyberahmedx.github.io/BREAKWATER/"
            echo
            awk -v v="$ver" 'index($0, "## [" v "]") == 1 { g = 1; print; next } g && /^## \[/ { exit } g { print }' CHANGELOG.md
          } > notes.md
          echo "----- notes.md -----"; cat notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Breakwater ${{ github.event.inputs.tag || github.ref_name }}
          # Body is the matching section of CHANGELOG.md (the new entry on a
          # version bump). GitHub's auto notes only list PRs, which misses
          # direct pushes to main.
          generate_release_notes: false
          body_path: notes.md

  # The desktop app: the same build inside a native window. The installers are
  # not code signed, so Windows shows a SmartScreen prompt on first run and
  # macOS needs a right-click and Open the first time.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          # one app that runs on both Apple silicon and Intel Macs
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          args: ${{ matrix.args }}
