[package]
name = "breakwater"
version = "0.0.0" # the real version comes from package.json, see tauri.conf.json
description = "A cozy-to-dark cybersecurity career simulation game."
edition = "2021"
publish = false

[lib]
name = "breakwater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
